name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mesh
          POSTGRES_PASSWORD: mesh_ci_only
          POSTGRES_DB: mesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh -d mesh_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://mesh:mesh_ci_only@localhost:5432/mesh_test
      MESH_TEST_DATABASE_URL: postgresql://mesh:mesh_ci_only@localhost:5432/mesh_test
      MESH_ADMIN_KEY: ci_only_operator_key_not_for_real_deployments
      MESH_TEST_AGENT_BINARY: ${{ github.workspace }}/agent/bin/mesh-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go build -o bin/mesh-agent ./cmd/mesh-agent
        working-directory: agent
      - run: go build -o bin/mesh-relay ./cmd/mesh-relay
        working-directory: agent
      - run: go build -o bin/mesh-executor ./cmd/mesh-executor
        working-directory: agent
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - name: Validate production deployment
        env:
          MESH_API_HOST: api.mesh.invalid
          MESH_RELAY_HOST: relay.mesh.invalid
          ACME_EMAIL: ci@mesh.invalid
        run: |
          node deploy/production/bootstrap.mjs
          docker compose -f deploy/production/compose.yaml config --quiet
          docker compose -f deploy/production/compose.yaml build controller relay
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/production:/etc/mesh:ro" prom/prometheus:v3.12.0 check rules /etc/mesh/alerts.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/deploy/production:/etc/mesh:ro" prom/alertmanager:v0.33.1 check-config /etc/mesh/alertmanager.yml
      - run: npm run test:remote
      - name: Validate cloud deployment
        working-directory: deploy/cloud
        run: |
          sh -n initialize.sh
          docker compose --env-file .env.example config --quiet
      - name: Build cloud service images
        working-directory: deploy/cloud
        run: docker compose --env-file .env.example build control-plane relay
  wsl-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Build Windows host agent
        working-directory: agent
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o bin/mesh-agent.exe ./cmd/mesh-agent
      - name: Build importable WSL2 compute bundle
        run: |
          mkdir -p agent/bin
          docker build --file deploy/wsl/Dockerfile --tag mesh-wsl-rootfs .
          docker create --name mesh-wsl-export mesh-wsl-rootfs
          docker export --output agent/bin/mesh-wsl-rootfs-amd64.tar mesh-wsl-export
          docker rm mesh-wsl-export
          cp deploy/windows/setup-mesh.ps1 agent/bin/setup-mesh.ps1
          cd agent/bin
          sha256sum mesh-wsl-rootfs-amd64.tar > mesh-wsl-rootfs-amd64.tar.sha256
          sha256sum mesh-agent.exe > mesh-agent.exe.sha256
          sha256sum --check mesh-wsl-rootfs-amd64.tar.sha256
          sha256sum --check mesh-agent.exe.sha256
      - name: Retain guided Windows package
        uses: actions/upload-artifact@v7
        with:
          name: mesh-windows-amd64
          path: |
            agent/bin/mesh-agent.exe
            agent/bin/mesh-agent.exe.sha256
            agent/bin/mesh-wsl-rootfs-amd64.tar
            agent/bin/mesh-wsl-rootfs-amd64.tar.sha256
            agent/bin/setup-mesh.ps1
          if-no-files-found: error
          retention-days: 7
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Check formatting
        shell: bash
        working-directory: agent
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
        working-directory: agent
      - run: go test -race ./...
        working-directory: agent
      - run: go build ./...
        working-directory: agent
      - run: go build ./...
        working-directory: agent
        env:
          GOOS: windows
          GOARCH: amd64
